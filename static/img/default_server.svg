<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Server Icon Gradient Background -->
    <linearGradient id="serverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32343A"/>
      <stop offset="50%" stop-color="#24262B"/>
      <stop offset="100%" stop-color="#18191D"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="serverAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E42"/>
      <stop offset="100%" stop-color="#E05315"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Container -->
  <circle cx="60" cy="60" r="60" fill="url(#serverBg)"/>
  <circle cx="60" cy="60" r="58.5" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Stylized Geometric Community Hub / Planet Emblem -->
  <!-- Center Glow Node -->
  <circle cx="60" cy="60" r="20" fill="url(#serverAccent)"/>

  <!-- Satellite Orbit Ring 1 -->
  <ellipse cx="60" cy="60" rx="38" ry="16" fill="none" stroke="#FF7E42" stroke-width="3" stroke-linecap="round" transform="rotate(-25 60 60)" opacity="0.85"/>
  <ellipse cx="60" cy="60" rx="38" ry="16" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 6" transform="rotate(-25 60 60)" opacity="0.5"/>

  <!-- Satellite Orbit Nodes -->
  <circle cx="30" cy="46" r="4.5" fill="#FFFFFF"/>
  <circle cx="90" cy="74" r="5" fill="#FF7E42"/>

  <!-- Community Hub Core Inner Icon (Cute Chat Bubble / Center star) -->
  <path d="M 60 48 L 63 56 L 71 58 L 65 64 L 67 72 L 60 68 L 53 72 L 55 64 L 49 58 L 57 56 Z" fill="#FFFFFF"/>
</svg>
