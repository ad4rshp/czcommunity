server {
    listen 80;
    server_name chillzone.com www.chillzone.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chillzone.com www.chillzone.com;

    ssl_certificate /etc/letsencrypt/live/chillzone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chillzone.com/privkey.pem;

    client_max_body_size 50M;

    location /static/ {
        alias /var/www/chillzone/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /var/www/chillzone/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets Configuration for Daphne / ASGI
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for long-lived WebSocket/WebRTC signaling connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
